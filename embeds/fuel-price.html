<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canadian Diesel Prices — Northern Mile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;color:#F2F4F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
a{text-decoration:none;color:inherit}
.widget{background:#0B0D11;border:1px solid #20262F;border-radius:6px;padding:20px 24px;display:flex;align-items:center;gap:20px;max-width:420px}
.widget .price{font-size:42px;font-weight:700;color:#1E9E66;line-height:1;font-variant-numeric:tabular-nums}
.widget .price .unit{font-size:18px;color:#A8B2BE;font-weight:400;margin-left:4px}
.widget .info{flex:1}
.widget .label{font-size:12px;color:#A8B2BE;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.widget .spread{font-size:14px;color:#D0D6E0;margin-top:6px}
.widget .spread span{color:#F5C518}
.widget .footer{font-size:10px;color:#A8B2BE;margin-top:8px}
.widget .footer a{color:#1E9E66}
</style></head><body>
<div class="widget" id="widget">
  <div class="price" id="price">—<span class="unit">c/L</span></div>
  <div class="info">
    <div class="label">Canadian diesel · national avg</div>
    <div class="spread" id="spread">Loading…</div>
    <div class="footer">Powered by <a href="https://dashboard.northernmilemedia.com" target="_top">Northern Mile</a> · live data</div>
  </div>
</div>
<script>
(async function(){
  try {
    const resp = await fetch('https://dashboard.northernmilemedia.com/data/fuel.json');
    const data = await resp.json();
    document.getElementById('price').innerHTML = data.diesel_national_avg + '<span class="unit">c/L</span>';
    const bc = data.provinces?.BC?.diesel, ab = data.provinces?.AB?.diesel;
    if (bc && ab) {
      document.getElementById('spread').innerHTML = 'BC ' + bc + ' · AB ' + ab + ' · spread <span>' + (bc-ab).toFixed(1) + 'c</span>';
    }
  } catch(e) {
    document.getElementById('price').innerHTML = '—<span class="unit">c/L</span>';
  }
  // Auto-resize iframe to fit content
  const h = document.querySelector('.widget').offsetHeight + 8;
  window.parent && window.parent.postMessage({type:'nmm-resize',height:h},'*');
})();
</script>
</body></html>
