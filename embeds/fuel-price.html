<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canadian Diesel Prices — Northern Mile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;color:#F2F4F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
a{text-decoration:none;color:inherit}
.widget{background:#0B0D11;border:1px solid #20262F;border-radius:8px;padding:24px 28px;display:flex;align-items:center;gap:24px;max-width:440px;position:relative;overflow:hidden}
.widget::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#1E9E66,#0E4D33)}
.widget .price{font-size:48px;font-weight:700;color:#1E9E66;line-height:1;font-variant-numeric:tabular-nums;font-family:'Saira Condensed',-apple-system,sans-serif;letter-spacing:-.02em}
.widget .price .unit{font-size:20px;color:#A8B2BE;font-weight:400;margin-left:4px;letter-spacing:0}
.widget .info{flex:1}
.widget .label{font-size:11px;color:#A8B2BE;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.widget .spread{font-size:14px;color:#D0D6E0;line-height:1.5}
.widget .spread b{color:#F5C518;font-weight:600}
.widget .footer{font-size:10px;color:#666;margin-top:10px;letter-spacing:.04em}
.widget .footer a{color:#1E9E66}
.widget .logo{position:absolute;top:12px;right:16px;font-size:10px;color:#2A2A2A;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
<div class="widget" id="widget">
  <div class="price" id="price">—<span class="unit">c/L</span></div>
  <div class="info">
    <div class="label">Canadian diesel</div>
    <div class="spread" id="spread">Loading…</div>
    <div class="footer">Powered by <a href="https://dashboard.northernmilemedia.com" target="_top">Northern Mile</a></div>
  </div>
  <div class="logo">NMM</div>
</div>
<script>
(async function(){
  try {
    let resp = await fetch('https://dashboard.northernmilemedia.com/data/fuel.json');
    if (!resp.ok) throw new Error('fetch failed');
    let data = await resp.json();
    document.getElementById('price').innerHTML = data.diesel_national_avg + '<span class="unit">c/L</span>';
    let bc = data.provinces?.BC?.diesel, ab = data.provinces?.AB?.diesel;
    if (bc && ab) {
      document.getElementById('spread').innerHTML = 'BC <b>'+bc+'</b> &nbsp;·&nbsp; AB <b>'+ab+'</b> &nbsp;·&nbsp; spread <b>'+(bc-ab).toFixed(1)+'c</b>';
    }
  } catch(e) {
    document.getElementById('price').innerHTML = '—<span class="unit">c/L</span>';
    document.getElementById('spread').textContent = 'Data unavailable';
  }
  let h = document.querySelector('.widget').offsetHeight + 8;
  window.parent && window.parent.postMessage({type:'nmm-resize',height:h},'*');
})();
</script>
</body></html>
