<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canada-US Border Wait Times — Northern Mile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;color:#F2F4F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
.widget{background:#0B0D11;border:1px solid #20262F;border-radius:8px;padding:20px 24px 16px;max-width:460px;position:relative;overflow:hidden}
.widget::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#1E9E66,#0E4D33)}
.widget .header{font-size:10px;color:#A8B2BE;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;font-weight:600}
.widget .crossing{display:flex;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid #15191E}
.widget .crossing:last-child{border-bottom:0}
.widget .crossing .name{flex:1;color:#D0D6E0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget .crossing .wait{font-weight:600;color:#F2F4F7;margin:0 12px;text-align:right;min-width:55px;font-variant-numeric:tabular-nums}
.widget .crossing .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.widget .dot.ok{background:#1E9E66;box-shadow:0 0 0 3px rgba(30,158,102,.2)}
.widget .dot.mod{background:#F5C518;box-shadow:0 0 0 3px rgba(245,197,24,.2)}
.widget .dot.heavy{background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.2)}
.widget .footer{font-size:9px;color:#555;margin-top:10px;letter-spacing:.04em;display:flex;justify-content:space-between}
.widget .footer a{color:#1E9E66}
</style></head><body>
<div class="widget">
  <div class="header">Cross-border · commercial wait</div>
  <div id="crossings"></div>
  <div class="footer">
    <span>Powered by <a href="https://dashboard.northernmilemedia.com" target="_top">Northern Mile</a></span>
    <span>live</span>
  </div>
</div>
<script>
(async function(){
  try {
    let resp = await fetch('https://dashboard.northernmilemedia.com/data/border.json');
    if (!resp.ok) throw new Error('fetch failed');
    let data = await resp.json();
    let crossings = (data.crossings || []).slice(0,5);
    let html = '';
    crossings.forEach(c => {
      let cls = c.delay_minutes > 10 ? 'heavy' : c.delay_minutes > 0 ? 'mod' : 'ok';
      html += '<div class="crossing"><span class="name">'+c.name+'</span><span class="wait">'+c.wait+'</span><span class="dot '+cls+'"></span></div>';
    });
    document.getElementById('crossings').innerHTML = html;
  } catch(e) {
    document.getElementById('crossings').innerHTML = '<div class="crossing"><span class="name">Data unavailable</span></div>';
  }
  let h = document.querySelector('.widget').offsetHeight + 8;
  window.parent && window.parent.postMessage({type:'nmm-resize',height:h},'*');
})();
</script>
</body></html>
